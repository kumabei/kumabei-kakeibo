<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="くまべえ家計簿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffecf0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="css/style.css">
<title>くまべえ家計簿</title>
</head>
<body>
<main>
  <section id="view-input" class="view"></section>
  <section id="view-home" class="view" hidden></section>
  <section id="view-calendar" class="view" hidden></section>
  <section id="view-history" class="view" hidden></section>
  <section id="view-settings" class="view" hidden></section>
</main>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<nav class="tabbar">
  <button class="tab" data-view="input">✏️<span>入力</span></button>
  <button class="tab" data-view="home">🏠<span>ホーム</span></button>
  <button class="tab" data-view="calendar">📅<span>カレンダー</span></button>
  <button class="tab" data-view="history">📋<span>履歴</span></button>
</nav>
<script type="module" src="js/app.js"></script>
</body>
</html>
